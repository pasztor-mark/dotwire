global
    maxconn 100000
    log stdout format raw local0

defaults
    log global
    mode http
    timeout connect 5s
    timeout client 120s
    timeout server 120s
    timeout tunnel 3600s

frontend http_in
    bind :8080
    mode http
    acl is_websocket hdr(Upgrade) -i WebSocket
    acl is_hub path_beg /hub/rooms

    use_backend gateway_backend if is_websocket or is_hub
    default_backend api_backend

backend gateway_backend
    mode http
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server gw1 dotwire-gateway-1:8080 check maxconn 200000
    server gw2 dotwire-gateway-2:8080 check maxconn 200000

backend api_backend
    mode http
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server api1 dotwire-api-1:8080 check maxconn 10000

frontend stats
    bind :8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s

