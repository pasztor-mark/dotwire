global
    maxconn 100000
    log stdout format raw local0

defaults
    log global
    mode http
    timeout connect 5s
    timeout client 120s
    timeout server 120s
    timeout tunnel 3600s
    timeout http-request 10s
    timeout http-keep-alive 15s

frontend http_in
    bind :8080
    mode http
    acl is_websocket hdr(Upgrade) -i WebSocket
    acl is_hub path_beg /hub/rooms
    acl is_sse path_reg ^/rooms/[^/]+/events/?$

    http-request deny deny_status 400 if { url_param(access_token) -m found } !is_hub !is_sse
    use_backend gateway_backend if is_websocket or is_hub or is_sse
    default_backend api_backend

backend gateway_backend
    mode http
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server gw1 dotwire-gateway-1:8080 check maxconn 200000
    server gw2 dotwire-gateway-2:8080 check maxconn 200000

backend api_backend
    mode http
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server api1 dotwire-api-1:8080 check maxconn 10000

frontend stats
    bind :8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats auth "admin:${HAPROXY_STATS_PASSWORD}"

