name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore dotwire.slnx

    - name: Build solution
      run: dotnet build dotwire.slnx --no-restore -c Release

    - name: Run unit & integration tests
      run: dotnet test dotwire.slnx --no-build -c Release --verbosity normal

    - name: Verify Native AOT Publish
      run: dotnet publish dotwire/dotwire.csproj -c Release
