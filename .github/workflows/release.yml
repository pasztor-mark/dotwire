name: Release

on:
  push:
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/pasztor-mark/dotwire

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Check tag matches package versions
      run: |
        version="${GITHUB_REF_NAME#v}"
        test "$(dotnet msbuild Dotwire.Host/Dotwire.Host.csproj -getProperty:Version)" = "$version"
        for p in client host react; do
          test "$(node -p "require('./packages/$p/package.json').version")" = "$version"
        done

    - name: Test .NET
      run: dotnet test dotwire.slnx -c Release --verbosity normal

    - name: Test npm packages
      working-directory: packages
      run: |
        npm ci
        npm run build --workspaces
        npm test --workspaces

  image:
    needs: verify
    strategy:
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-24.04
        - arch: arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: docker/build-push-action@v6
      with:
        context: .
        file: dotwire/Dockerfile
        push: true
        tags: ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}

  manifest:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Merge per-architecture images
      run: |
        version="${GITHUB_REF_NAME#v}"
        docker buildx imagetools create \
          -t "$IMAGE:$version" \
          -t "$IMAGE:latest" \
          "$IMAGE:$GITHUB_REF_NAME-amd64" \
          "$IMAGE:$GITHUB_REF_NAME-arm64"

  nuget:
    needs: manifest
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Pack
      run: dotnet pack Dotwire.Host/Dotwire.Host.csproj -c Release -o nupkg

    - name: Push
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: dotnet nuget push "nupkg/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  npm:
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        registry-url: https://registry.npmjs.org

    - name: Build
      working-directory: packages
      run: |
        npm ci
        npm run build --workspaces

    - name: Publish
      working-directory: packages
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        version="${GITHUB_REF_NAME#v}"
        for p in client host react; do
          cp ../LICENSE "$p/LICENSE"
          npm view "@dotwire/$p@$version" version 2>/dev/null | grep -q . \
            || npm publish -w "$p" --access public --provenance
        done
