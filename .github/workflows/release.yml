name: Release

on:
  push:
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/pasztor-mark/dotwire

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
      with:
        dotnet-version: '10.0.x'

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'

    - name: Check tag matches package versions
      run: |
        set -x
        version="${GITHUB_REF_NAME#v}"
        test "$(dotnet msbuild Dotwire.Host/Dotwire.Host.csproj -getProperty:Version)" = "$version"
        for p in client host react; do
          test "$(node -p "require('./packages/$p/package.json').version")" = "$version"
        done

    - name: Test .NET
      run: dotnet test dotwire.slnx -c Release --verbosity normal

    - name: Test npm packages
      working-directory: packages
      run: |
        npm ci
        npm run build --workspaces
        npm test --workspaces

  image:
    needs: verify
    strategy:
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-24.04
        - arch: arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: .
        file: dotwire/Dockerfile
        push: true
        provenance: mode=max
        sbom: true
        tags: ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}

  manifest:
    needs: image
    runs-on: ubuntu-latest
    environment: release
    permissions:
      packages: write

    steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Merge per-architecture images
      run: |
        version="${GITHUB_REF_NAME#v}"
        docker buildx imagetools create \
          -t "$IMAGE:$version" \
          -t "$IMAGE:latest" \
          "$IMAGE:$GITHUB_REF_NAME-amd64" \
          "$IMAGE:$GITHUB_REF_NAME-arm64"

  nuget:
    needs: manifest
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
      with:
        dotnet-version: '10.0.x'

    - name: Pack
      run: dotnet pack Dotwire.Host/Dotwire.Host.csproj -c Release -o nupkg

    - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push "nupkg/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  npm:
    needs: manifest
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
        registry-url: https://registry.npmjs.org

    - name: Build
      working-directory: packages
      run: |
        npm ci
        npm run build --workspaces

    - name: Publish
      working-directory: packages
      run: |
        version="${GITHUB_REF_NAME#v}"
        for p in client host react; do
          cp ../LICENSE "$p/LICENSE"
          npm view "@dotwire/$p@$version" version 2>/dev/null | grep -q . \
            || npm publish -w "$p" --access public --provenance
        done
